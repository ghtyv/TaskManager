# БД PostgreSQL 17
spring.application.name=Task Manager REST API Spring Boot
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=123
spring.jpa.hibernate.ddl-auto=validate

# S3-совместимое хранилище (localstack-persist)
app.s3.endpoint=http://localhost:4566
app.s3.region=us-east-1
app.s3.access-key=test
app.s3.secret-key=test
app.s3.bucket=task-manager-attachments

# Каталог для хранения временных файлов. /var/tmp каталог не должен очищаться после перезагрузки системы, в отличие от
# /tmp.
app.upload.temp-dir=/var/tmp/task-manager-uploads

spring.servlet.multipart.max-file-size=400MB
spring.servlet.multipart.max-request-size=410MB